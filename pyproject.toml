[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion"
version = "0.1.0"
description = "Kernel de confiance déterministe + banc d'essai comportemental. La preuve décide, pas l'intention."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AION" }]
keywords = ["agent", "trust", "evaluation", "uncertainty", "pre-registration"]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
grok = ["openai>=1.40"]
all = ["anthropic>=0.40", "openai>=1.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
aion = "aion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
