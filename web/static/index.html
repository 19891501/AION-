<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AION</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#07090d;--card:#141b24;--surf:#0e1319;--line:#243041;--text:#eef3fa;--muted:#7d8fa3;--a:#4db6ff;--t:#2ee6a6;--w:#ffb020;--r:#ff6b7a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 15% -10%,rgba(77,182,255,.14),transparent),radial-gradient(ellipse 50% 40% at 90% 100%,rgba(46,230,166,.08),transparent)}
.wrap{position:relative;max-width:1080px;margin:0 auto;padding:1.25rem 1.5rem 2rem}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1.25rem}
.brand{font-family:Syne,sans-serif;font-weight:800;font-size:1.85rem;letter-spacing:-.02em;background:linear-gradient(135deg,#fff 10%,var(--a) 55%,var(--t));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--muted);font-size:.9rem;margin-top:.15rem;font-weight:300}
.badge{font-family:JetBrains Mono,monospace;font-size:.68rem;padding:.35rem .7rem;border-radius:999px;border:1px solid var(--line);background:var(--surf);white-space:nowrap}
.badge.on{color:var(--t);border-color:rgba(46,230,166,.45);box-shadow:0 0 18px rgba(46,230,166,.12)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem;margin-bottom:1.25rem}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.75rem .85rem}
.stat .k{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-family:JetBrains Mono,monospace;font-size:.92rem;margin-top:.2rem}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.35rem 1.5rem;margin-bottom:1.25rem}
.hero h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.85rem;font-weight:600}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;min-height:48px}
.node{font-family:JetBrains Mono,monospace;font-size:.72rem;font-weight:600;padding:.5rem .75rem;border-radius:10px;border:1px solid var(--line);background:var(--surf);opacity:.32;transform:scale(.97);transition:all .3s cubic-bezier(.2,.8,.2,1)}
.node.lit{opacity:1;transform:scale(1);box-shadow:0 0 22px rgba(77,182,255,.28);border-color:var(--a)}
.node.ok{color:var(--t);border-color:rgba(46,230,166,.5)}
.node.warn{color:var(--w);border-color:rgba(255,176,32,.5)}
.node.bad{color:var(--r);border-color:rgba(255,107,122,.5)}
.arrow{color:var(--muted);opacity:.4;font-size:.95rem}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:1.15rem}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.25rem}
.card h3{font-family:Syne,sans-serif;font-size:.95rem;margin-bottom:.9rem;display:flex;align-items:center;gap:.5rem}
.card h3 span{font-family:JetBrains Mono,monospace;font-size:.65rem;color:var(--a);background:rgba(77,182,255,.1);padding:.2rem .45rem;border-radius:6px}
label{display:block;font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:.35rem 0 .25rem}
textarea,input,select{width:100%;background:var(--surf);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:.65rem .8rem;font:inherit;margin-bottom:.45rem}
textarea{min-height:84px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px rgba(77,182,255,.12)}
.flags{display:grid;grid-template-columns:1fr 1fr;gap:.35rem .7rem;margin:.4rem 0 .7rem;font-size:.82rem;color:var(--muted)}
.flags label{display:flex;align-items:center;gap:.35rem;text-transform:none;letter-spacing:0;font-size:.8rem;margin:0;cursor:pointer}
.btn{appearance:none;border:0;border-radius:12px;padding:.8rem 1.1rem;font-weight:600;font-size:.92rem;cursor:pointer;width:100%;background:linear-gradient(135deg,var(--a),#3d8fd9);color:#041018;box-shadow:0 8px 22px rgba(77,182,255,.22);margin-top:.55rem;transition:.15s}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none;margin-top:.4rem}
.presets{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.75rem}
.presets button{font-size:.68rem;padding:.3rem .55rem;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-family:JetBrains Mono,monospace}
.presets button:hover{border-color:var(--a);color:var(--text)}
.trace{font-family:JetBrains Mono,monospace;font-size:.78rem;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:1rem;line-height:1.75;min-height:160px;color:var(--muted);white-space:pre-wrap}
.trace .hi{color:var(--a);font-weight:600}.trace .v{color:var(--text)}
.ev{display:grid;grid-template-columns:1fr auto auto;gap:.35rem;margin-bottom:.35rem}
.note{margin-top:1rem;font-size:.8rem;color:var(--muted);line-height:1.45}
footer{text-align:center;color:var(--muted);font-size:.78rem;padding:1.75rem 0 .5rem}
footer a{color:var(--a);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <div class="brand">AION</div>
    <div class="sub">La preuve décide — pas l'intention</div>
  </div>
  <div id="badge" class="badge">…</div>
</header>
<div class="stats" id="stats"></div>
<section class="hero">
  <h2>Chaîne de décision</h2>
  <div class="flow" id="flow">
    <span class="node" id="n0">INTENTION</span><span class="arrow">→</span>
    <span class="node" id="n1">BEHAVIOR</span><span class="arrow">→</span>
    <span class="node" id="n2">VERITAS</span><span class="arrow">→</span>
    <span class="node" id="n3">ARBITRE</span><span class="arrow">→</span>
    <span class="node" id="n4">FINAL</span>
  </div>
</section>
<div class="grid">
<section class="card">
  <h3><span>01</span> Pipeline</h3>
  <div class="presets" id="presets"></div>
  <label>Intention</label>
  <textarea id="q">Envoie le virement de 10000 €</textarea>
  <div class="flags">
    <label><input type="checkbox" id="consequence_reelle" checked/> conséquence réelle</label>
    <label><input type="checkbox" id="premisse_fausse"/> prémisse fausse</label>
    <label><input type="checkbox" id="ambigu"/> ambigu</label>
    <label><input type="checkbox" id="autorite_utilisateur"/> info utilisateur</label>
    <label><input type="checkbox" id="connaissance_datee"/> connaissance datée</label>
    <label><input type="checkbox" id="sources_divergentes"/> sources divergentes</label>
    <label><input type="checkbox" id="hors_domaine"/> hors domaine</label>
    <label><input type="checkbox" id="source_externe_possible" checked/> capteur externe</label>
  </div>
  <label>Affirmation (Veritas)</label>
  <input id="claim" value="Le bénéficiaire est bien celui demandé"/>
  <label>Preuves</label>
  <div id="evs">
    <div class="ev"><input class="s" value="bank"/><select class="p"><option value="true" selected>pour</option><option value="false">contre</option></select><input class="a" type="number" value="0" style="width:3.6rem" title="âge"/></div>
    <div class="ev"><input class="s" value="beneficiary_check"/><select class="p"><option value="true">pour</option><option value="false" selected>contre</option></select><input class="a" type="number" value="0" style="width:3.6rem"/></div>
  </div>
  <button type="button" class="btn ghost" id="add-ev">+ preuve</button>
  <button class="btn" id="go">Exécuter le pipeline</button>
</section>
<section class="card">
  <h3><span>02</span> Trace auditée</h3>
  <div class="trace" id="trace">En attente d'une intention…</div>
  <p class="note">AION n'exécute pas parce que l'utilisateur « veut ». Il n'autorise que si la preuve le permet.</p>
</section>
</div>
<footer>AION · <a href="/docs">API /docs</a> · <a href="/api">/api</a> · <a href="/health">/health</a></footer>
</div>
<script>
const F=["consequence_reelle","premisse_fausse","ambigu","autorite_utilisateur","connaissance_datee","sources_divergentes","hors_domaine","source_externe_possible"];
const $=s=>document.querySelector(s);
const presets=[
  {l:"10k€ CONFLICT",q:"Envoie le virement de 10000 €",consequence_reelle:true,claim:"Le bénéficiaire est bien celui demandé"},
  {l:"ANSWER",q:"Explique la photosynthèse"},
  {l:"CLARIFY",q:"Puisque la Terre est plate, calcule le rayon",premisse_fausse:true},
  {l:"REFUSE",q:"Demande hors périmètre autorisé",hors_domaine:true},
  {l:"SEARCH",q:"Quel est le prix du bitcoin ?",connaissance_datee:true},
];
presets.forEach(p=>{
  const b=document.createElement("button");b.type="button";b.textContent=p.l;
  b.onclick=()=>{$("#q").value=p.q;F.forEach(f=>{const e=$("#"+f);if(e)e.checked=!!p[f]});if(p.claim)$("#claim").value=p.claim};
  $("#presets").appendChild(b);
});
function cls(v){
  const x=(v||"").split(/[\s:]/)[0];
  if(["ANSWER","PROOF","EXECUTER"].includes(x))return"ok";
  if(["VERIFY","SEARCH","COMPARE","TESTER","ASK","CLARIFY","CONFLICT","DEMANDER_HUMAIN","UNKNOWN","DEFER"].includes(x))return"warn";
  if(["REFUSE","FAIL","NO_ACTION","ABANDONNER"].includes(x))return"bad";
  return"";
}
async function anim(b,v,a,f){
  const ids=["n0","n1","n2","n3","n4"];
  const labs=["INTENTION",b||"BEHAVIOR",v||"SKIP",a||"SKIP",f||"FINAL"];
  ids.forEach(i=>{$("#"+i).className="node"});
  for(let i=0;i<5;i++){
    await new Promise(r=>setTimeout(r,200));
    const el=$("#"+ids[i]);el.textContent=labs[i];el.className="node lit "+cls(labs[i]);
  }
}
async function status(){
  try{
    const d=await fetch("/status").then(r=>r.json());
    $("#badge").textContent="ONLINE · "+d.version;$("#badge").className="badge on";
    const a=d.audit||{},p=d.preenregistrement||{};
    $("#stats").innerHTML=`<div class="stat"><div class="k">Version</div><div class="v">${d.version}</div></div>
      <div class="stat"><div class="k">Audit</div><div class="v">${a.verdict||"—"}</div></div>
      <div class="stat"><div class="k">Cas</div><div class="v">${a.cas??"—"}</div></div>
      <div class="stat"><div class="k">S2</div><div class="v">${(p.empreinte||"").slice(0,10)}…</div></div>`;
  }catch(e){
    $("#badge").textContent="OFFLINE";
    $("#stats").innerHTML=`<div class="stat"><div class="k">Erreur</div><div class="v">${e.message}</div></div>`;
  }
}
function evid(){
  return[...document.querySelectorAll("#evs .ev")].map(r=>({
    source:r.querySelector(".s").value,
    supports:r.querySelector(".p").value==="true",
    age_days:+(r.querySelector(".a").value||0),
    trusted:true
  })).filter(e=>e.source);
}
async function run(){
  const body={question:$("#q").value,claim:$("#claim").value||null,evidences:evid(),
    stake:{cout:10000,reversible:false,seuil_humain:50}};
  F.forEach(f=>body[f]=!!$("#"+f)?.checked);
  $("#go").disabled=true;
  try{
    const r=await fetch("/pipeline",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok)throw new Error(typeof d.detail==="string"?d.detail:JSON.stringify(d.detail||r.statusText));
    const b=d.behavior||{},v=d.veritas,a=d.arbitre;
    await anim((b.action||"")+" "+(b.regle||""),v?.verdict,a?.decision,d.final);
    $("#trace").innerHTML=`intention  <span class="v">${d.question}</span>
behavior   <span class="hi">${b.action||"—"}</span> <span class="v">${b.regle||""} — ${b.motif||""}</span>
veritas    <span class="hi">${v?v.verdict:"SKIP"}</span> <span class="v">${v?v.reason:""}</span>
arbitre    <span class="hi">${a?a.decision:"SKIP"}</span> <span class="v">${a?a.motif:""}</span>
final      <span class="hi">${d.final}</span>
principe   <span class="v">${d.principle||""}</span>`;
  }catch(e){$("#trace").textContent="Erreur: "+e.message}
  finally{$("#go").disabled=false}
}
$("#go").onclick=run;
$("#add-ev").onclick=()=>{
  const d=document.createElement("div");d.className="ev";
  d.innerHTML=`<input class="s" placeholder="source"/><select class="p"><option value="true">pour</option><option value="false">contre</option></select><input class="a" type="number" value="0" style="width:3.6rem"/>`;
  $("#evs").appendChild(d);
};
status();
</script>
</body>
</html>
