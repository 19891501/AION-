name: Anthropic Burn (AION mesure)

on:
  workflow_dispatch:
    inputs:
      modele:
        description: "Modèle Claude (ID API exact)"
        required: true
        default: "claude-haiku-4-5-20251001"
        type: choice
        options:
          - claude-haiku-4-5-20251001
          - claude-sonnet-4-6
          - claude-sonnet-4-5-20250929
      phase:
        description: "Phase"
        required: true
        default: "all"
        type: choice
        options:
          - micro
          - all
          - etendue
      cout_max:
        description: "Plafond USD estimé (tokens)"
        required: true
        default: "25"

jobs:
  burn:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          pip install -U pip
          pip install -e ".[anthropic]"
          python -c "from aion.budget import Budget; from aion.providers import charger; print('OK')"

      - name: Preflight
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AION_MODEL: ${{ inputs.modele }}
        run: |
          python - <<'PY'
          import os, sys
          key = os.environ.get("ANTHROPIC_API_KEY", "")
          if not key:
              print("FAIL: secret absent"); sys.exit(1)
          print("secret OK (len=%d)" % len(key))
          from aion.providers import charger
          from aion.budget import cout_tokens
          model = os.environ.get("AION_MODEL", "claude-haiku-4-5-20251001")
          p = charger("anthropic", modele=model)
          r = p.complete("Réponds uniquement: OK", max_tokens=8)
          c = cout_tokens(r.tokens_entree, r.tokens_sortie, model)
          print("preflight:", r.modele, repr(r.texte[:40]),
                "in", r.tokens_entree, "out", r.tokens_sortie, f"~${c:.6f}")
          PY

      - name: Micro campagne
        if: inputs.phase == 'micro' || inputs.phase == 'all'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p results/cache_anthropic results/ci_micro
          python -m aion bench --provider anthropic \
            --modele "${{ inputs.modele }}" --micro \
            --entree paraphrase --extracteur llm \
            --cache results/cache_anthropic \
            --budget-appels 150 --cout-max "${{ inputs.cout_max }}" \
            --out results/ci_micro || true
          ls -la results/ci_micro || true

      - name: Campagne étendue
        if: inputs.phase == 'etendue' || inputs.phase == 'all'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p results/cache_anthropic results/ci_etendue
          python -m aion bench --provider anthropic \
            --modele "${{ inputs.modele }}" \
            --entree paraphrase --extracteur llm \
            --reps 5 --max-cas 20 \
            --cache results/cache_anthropic \
            --budget-appels 800 --cout-max "${{ inputs.cout_max }}" \
            --out results/ci_etendue || true
          ls -la results/ci_etendue || true

      - name: Upload résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aion-anthropic-results
          path: |
            results/ci_micro/
            results/ci_etendue/
          if-no-files-found: warn
          retention-days: 14
