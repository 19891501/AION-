services:
  - type: web
    name: aion
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: AION_PROVIDER
        value: local
      - key: PYTHONPATH
        value: src
