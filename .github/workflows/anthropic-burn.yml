name: Anthropic Burn (AION mesure)

on:
  workflow_dispatch:
    inputs:
      modele:
        description: "Modèle Claude"
        required: true
        default: "claude-3-5-haiku-latest"
        type: choice
        options:
          - claude-3-5-haiku-latest
          - claude-3-haiku-20240307
          - claude-sonnet-4-6
          - claude-3-5-sonnet-latest
      phase:
        description: "Phase"
        required: true
        default: "all"
        type: choice
        options:
          - micro
          - all
          - etendue

jobs:
  burn:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          pip install -U pip
          pip install -e ".[anthropic]"
          python -c "from aion.providers import charger; print('import OK', charger)"

      - name: Preflight
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AION_MODEL: ${{ inputs.modele }}
        run: |
          python - <<'PY'
          import os, sys
          key = os.environ.get("ANTHROPIC_API_KEY", "")
          if not key:
              print("FAIL: secret ANTHROPIC_API_KEY absent")
              sys.exit(1)
          print("secret OK (len=%d)" % len(key))
          from aion.providers import charger
          p = charger("anthropic", modele=os.environ.get("AION_MODEL", "claude-3-5-haiku-latest"))
          r = p.complete("Réponds uniquement: OK", max_tokens=8)
          print("preflight:", r.modele, repr(r.texte[:60]), "in", r.tokens_entree, "out", r.tokens_sortie)
          PY

      - name: Micro campagne
        if: inputs.phase == 'micro' || inputs.phase == 'all'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p results/cache_anthropic results/ci_micro
          python -m aion bench --provider anthropic \
            --modele "${{ inputs.modele }}" --micro \
            --entree paraphrase --extracteur llm \
            --cache results/cache_anthropic \
            --budget-appels 150 --cout-appel 0.02 \
            --out results/ci_micro || true
          ls -la results/ci_micro || true

      - name: Campagne étendue
        if: inputs.phase == 'etendue' || inputs.phase == 'all'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p results/cache_anthropic results/ci_etendue
          python -m aion bench --provider anthropic \
            --modele "${{ inputs.modele }}" \
            --entree paraphrase --extracteur llm \
            --reps 5 --max-cas 20 \
            --cache results/cache_anthropic \
            --budget-appels 800 --cout-appel 0.02 \
            --out results/ci_etendue || true
          ls -la results/ci_etendue || true

      - name: Upload résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aion-anthropic-results
          path: |
            results/ci_micro/
            results/ci_etendue/
          if-no-files-found: warn
          retention-days: 14
